<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc"><title id="title">書類確認の整理図</title><desc id="desc">封筒内の一覧にはYNG-19-04／当日聞き取り・片瀬とあるが、対応する文書は封筒内に見当たらない。正式証言の写しは封筒内にある。持ち出した人物は示さない。</desc><style>text{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:22px;fill:#26343d}.small{font-size:22px}</style><rect width="100%" height="100%" fill="#fdfcf9"/><text x="28" y="40" style="font-size:22px">書類確認の整理図</text><rect x="28" y="70" width="424" height="390" rx="4" fill="#f3f4ef" stroke="#8b9ca5"/><text x="46" y="108" style="font-size:22px">封筒内にあった一覧の該当項目</text><text x="46" y="145" style="font-size:22px">YNG-19-04／</text><text x="46" y="179" style="font-size:22px">当日聞き取り・片瀬</text><rect x="474" y="70" width="424" height="390" rx="4" fill="#f3f4ef" stroke="#8b9ca5"/><text x="492" y="108" style="font-size:22px">確認結果</text><text x="492" y="145" style="font-size:22px">対応する文書は封筒内に見当たらない</text><text x="28" y="496" style="font-size:19px">正式証言の写しは封筒内にある。</text></svg>
