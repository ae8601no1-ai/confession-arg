<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc"><title id="title">片瀬玲奈の証言・記録抜粋</title><desc id="desc">片瀬玲奈の二つの記録の抜粋。2019年11月18日の聞き取りでは千尋の北の扉と資材への指摘を聞いたと答え、2019年11月21日の正式証言では避難口の話は聞かなかったとしている。原本画像ではない。</desc><style>text{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:22px;fill:#26343d}.small{font-size:22px}</style><rect width="100%" height="100%" fill="#fdfcf9"/><text x="28" y="40" style="font-size:22px">片瀬玲奈の証言・記録抜粋</text><rect x="28" y="70" width="424" height="390" rx="4" fill="#f3f4ef" stroke="#8b9ca5"/><text x="46" y="108" style="font-size:22px">当初の聞き取り</text><text x="46" y="145" style="font-size:22px">2019年11月18日</text><text x="46" y="179" style="font-size:22px">発言者：片瀬玲奈</text><text x="46" y="213" style="font-size:22px">記録抜粋</text><text x="46" y="257" style="font-size:22px">千尋が、北の扉が開かないと言ってい</text><text x="46" y="291" style="font-size:22px">ました。資材をどけないと危ないと。</text><text x="46" y="325" style="font-size:22px">三崎さんに言った方がいいと、私は答</text><text x="46" y="359" style="font-size:22px">えました。</text><rect x="474" y="70" width="424" height="390" rx="4" fill="#f3f4ef" stroke="#8b9ca5"/><text x="492" y="108" style="font-size:22px">正式証言</text><text x="492" y="145" style="font-size:22px">2019年11月21日</text><text x="492" y="179" style="font-size:22px">発言者：片瀬玲奈</text><text x="492" y="213" style="font-size:22px">記録抜粋</text><text x="492" y="257" style="font-size:22px">千尋から避難口に関する話は聞かなか</text><text x="492" y="291" style="font-size:22px">った。</text><text x="28" y="496" style="font-size:19px">二つの記録の該当部分を転記した比較表示。原本の画像ではありません。</text></svg>
