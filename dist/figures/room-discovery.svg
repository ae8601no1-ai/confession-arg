<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">応接室・発見時の概略配置</title><desc id="desc">北が上、南が下。入口は南側で窓はない。壁から離れた中央寄りの机の北側の縁に青い封筒がある。被害者の正確な位置と人物の立ち位置は描かない。</desc><style>text{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:22px;fill:#26343d}.small{font-size:22px}</style><rect width="100%" height="100%" fill="#fdfcf9"/><text x="240" y="35" text-anchor="middle">北 ↑</text><text x="240" y="75" text-anchor="middle" class="small">窓なし</text><path d="M210 370H60V90H420V370H270" fill="none" stroke="#314958" stroke-width="5"/><text x="240" y="402" text-anchor="middle" class="small">入口（概略）</text><text x="240" y="440" text-anchor="middle">南 ↓</text><rect data-part="desk" x="160" y="180" width="160" height="100" fill="#e6e4da" stroke="#314958" stroke-width="3"/><text x="240" y="247" text-anchor="middle">机</text><rect data-part="envelope" x="205" y="180" width="70" height="22" fill="#466f91" stroke="#203d58" stroke-width="2"/><text x="240" y="160" text-anchor="middle" class="small">青い封筒</text></svg>
